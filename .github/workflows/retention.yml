name: Purge RGPD des données périmées

# Applique les durées de conservation annoncées dans la politique de
# confidentialité (art. 5.1.e du RGPD). Voir lib/retention.ts pour les seuils
# et la raison de chacun.
#
# ⚠ Déclenchement manuel uniquement — la planification vit ailleurs.
#
# Depuis le passage de Vercel à Clever Cloud, l'horaire est porté par
# `clevercloud/cron.json` (4 h du matin), exécuté par l'instance elle-même. Le
# garder aussi ici ferait tourner la purge deux fois par nuit : sans dégât — la
# purge est idempotente — mais avec deux endroits à corriger, et l'un des deux
# qu'on oublierait.
#
# Cette obligation-là ne tolère pas l'à-peu-près : c'est une purge légale
# (art. 5.1.e du RGPD), pas une tâche de confort. Vérifier après déploiement
# qu'elle tourne bien côté Clever Cloud : `clever logs | grep cron`.
#
# Le déclenchement manuel reste disponible. Il exige deux secrets du dépôt
# (Settings → Secrets and variables → Actions) :
#   SITE_URL     — l'URL de production, soit https://o3saveurs.fr
#   CRON_SECRET  — la même valeur que la variable Clever Cloud du même nom.

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/retention
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/retention")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Échec HTTP $status"
            exit 1
          fi
