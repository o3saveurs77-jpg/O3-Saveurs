name: Relance panier abandonné

# ⚠ Déclenchement manuel uniquement — la planification vit ailleurs.
#
# Ce workflow date de l'hébergement Vercel, dont l'offre Hobby limitait les Cron
# Jobs intégrés à une exécution par jour. Depuis le passage à Clever Cloud, la
# planification est portée par `clevercloud/cron.json`, exécuté par l'instance
# elle-même : pas de secret à tenir à jour en double, et l'horaire suit
# `NEXTAUTH_URL` sans qu'on ait à le redire ici.
#
# L'horaire a donc été retiré, sans quoi les deux planificateurs appelleraient
# la même route — inoffensif (la relance est idempotente, voir `dedupeKey` dans
# lib/email.ts) mais deux fois plus d'appels pour rien, et deux endroits à
# corriger le jour où le domaine change.
#
# Le déclenchement manuel reste utile pour tester la route sans attendre le
# prochain quart d'heure. Il exige deux secrets du dépôt
# (Settings → Secrets and variables → Actions) :
#   SITE_URL     — l'URL de production, soit https://o3saveurs.fr
#   CRON_SECRET  — la même valeur que la variable Clever Cloud du même nom.

on:
  workflow_dispatch:

jobs:
  relance:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/abandoned-carts
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/abandoned-carts")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Échec HTTP $status"
            exit 1
          fi
